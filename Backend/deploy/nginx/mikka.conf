# Nginx reverse proxy for the Mikka API — its own file, separate from
# RoyalVIP's site. __DOMAIN__ / __PORT__ are filled in by server-setup.sh;
# certbot then adds the 443/SSL block to this file only.
#
# The map variable is prefixed "mikka_" so it can't clash with a
# $connection_upgrade map another site on this server may already define.
map $http_upgrade $mikka_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream mikka_api {
    server 127.0.0.1:__PORT__;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    access_log /var/log/nginx/mikka.access.log;
    error_log  /var/log/nginx/mikka.error.log;

    # Avatar / media uploads go through the API.
    client_max_body_size 50M;

    location / {
        proxy_pass http://mikka_api;
        proxy_http_version 1.1;

        # Socket.IO (/chat, /notifications, /call) needs the upgrade headers.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mikka_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived sockets would otherwise be cut after 60s of silence.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
