# Nginx reverse proxy for the Mikka API. __DOMAIN__ is replaced by
# server-setup.sh; certbot then adds the 443/SSL block automatically.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Avatar / media uploads go through the API.
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3112;
        proxy_http_version 1.1;

        # Socket.IO (/chat, /notifications, /call) needs the upgrade headers.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived sockets would otherwise be cut after 60s of silence.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
